name: Bug report
description: Report an unwanted audio switch or another reproducible problem.
body:
  - type: input
    id: version
    attributes:
      label: Guardio version and package
      placeholder: v0.3.0, standalone ZIP
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Windows version, controller and connection
      placeholder: Windows 11, DualSense, USB
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Include your headset or speakers model.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt (optional)
      description: Remove device IDs before posting.
      render: text
