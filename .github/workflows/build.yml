name: Build and policy tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build desktop application
        run: dotnet build src/Guardio/Guardio.csproj -c Release --nologo
      - name: Run policy scenarios
        run: dotnet run --project tests/Guardio.Tests/Guardio.Tests.csproj -c Release
      - name: Package both Windows x64 builds
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Guardio-windows-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
